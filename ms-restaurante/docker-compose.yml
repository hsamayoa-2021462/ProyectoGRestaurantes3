services:
  postgres:
    image: postgres:16
    container_name: proyectorestaurante_postgres
    restart: always
    environment:
      POSTGRES_DB: ProyectoGRestaurantes3
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d ProyectoGRestaurantes3"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
